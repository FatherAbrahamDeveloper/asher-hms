# Render Blueprint: the API server (free plan). Create it with Render → New → Blueprint → pick this repository.
# Secrets marked sync:false are typed in on Render's dashboard; generateValue ones are created for you once.
services:
  - type: web
    name: asher-hms-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # Neon "pooled" connection string
        sync: false
      - key: DIRECT_URL            # Neon "direct" (unpooled) connection string, used for migrations
        sync: false
      - key: APP_URL               # the Vercel address, e.g. https://asher-hms.vercel.app
        sync: false
      - key: CLIENT_ORIGIN         # same as APP_URL (add a custom domain here later, comma-separated)
        sync: false
      - key: TRUST_PROXY           # browser → Vercel → Render
        value: "2"
      - key: SERVE_CLIENT
        value: "false"
      - key: DATA_ENCRYPTION_KEY   # 32 random bytes, base64. NEVER change it after go-live: ID numbers depend on it.
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Asher Hotel and Suites <no-reply@asherhotel.ng>"
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: AsherHotel
      - key: PAYSTACK_SECRET_KEY
        sync: false
