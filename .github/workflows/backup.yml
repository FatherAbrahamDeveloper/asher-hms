# Nightly database backup (Neon free tier keeps only a short history).
# Needs repository secret DIRECT_URL = Neon direct connection string. Backups are kept as private run artifacts for 30 days.
# To restore: download the artifact, then  pg_restore --clean --no-owner -d "<connection string>" asher-backup.dump
name: nightly-backup
on:
  schedule:
    - cron: "15 1 * * *"   # 02:15 Lagos time
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    container: postgres:18
    timeout-minutes: 20
    steps:
      - name: Dump database
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: pg_dump --format=custom --no-owner --file=asher-backup.dump "$DIRECT_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: asher-backup-${{ github.run_number }}
          path: asher-backup.dump
          retention-days: 30
